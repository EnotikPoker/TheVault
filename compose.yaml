services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: thevault
      POSTGRES_PASSWORD: thevault_dev
      POSTGRES_DB: thevault
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thevault -d thevault"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
