name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: thevault
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: thevault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thevault -d thevault_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://thevault:test_password@127.0.0.1:5432/thevault_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make install
      - name: Check Go formatting
        run: test -z "$(gofmt -l backend)"
      - run: make check
      - run: make test
      - run: make test-integration
      - run: make build
